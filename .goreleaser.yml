version: 2
project_name: onctl

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    # - go generate ./...

builds:
  - binary: onctl
    id: onctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -w -s -X 'github.com/cdalar/onctl/cmd.Version=v{{.Version}}-{{.ShortCommit}}'


archives:
  - id: repl
    name_template: "{{ .ProjectName }}-{{.Os}}-{{.Arch}}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # files:
    #   - non-existent*

checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  # GitHub's own release notes: every pull request merged since the previous
  # release, with its title, author and link -- not commit subjects, which
  # with merge commits left a release's notes nearly empty. Grouping is
  # .github/release.yml's. The previous release is the last one actually
  # published (GORELEASER_PREVIOUS_TAG, set by goreleaser.yml), so a tag
  # whose release failed doesn't take its PRs with it.
  use: github-native

release:
  github:
    owner: cdalar
    name: onctl
  prerelease: auto
