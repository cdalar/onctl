version: 2
project_name: onctl

# Used only by .github/workflows/edge.yml -- a lighter config for
# continuous builds off the tip of main, separate from .goreleaser.yml
# (real tagged releases: GPG-signed checksums, GitHub release with
# changelog). None of that applies to an edge build, so it's a dedicated
# config rather than reusing goreleaser.yml with skip flags -- includes
# Linux and macOS, no signs section.

before:
  hooks:
    - go mod tidy

builds:
  - binary: onctl
    id: onctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w -s -X 'github.com/cdalar/onctl/cmd.Version=v{{.Version}}-{{.ShortCommit}}'

archives:
  - id: repl
    name_template: "{{ .ProjectName }}-{{.Os}}-{{.Arch}}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

# --snapshot (the OSS equivalent used here, see this workflow's own header
# comment for why) skips all validation, so .Version comes purely from this
# template rather than the latest git tag -- distinguishes an edge build's
# `onctl version` output from a real release at a glance.
snapshot:
  version_template: "{{ incpatch .Version }}-edge"
