name: goreleaser

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: onctl-2
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false
      - name: Import GPG Key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --no-tty --batch
          gpg --list-secret-keys
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Find the previous published release
        # Not the previous tag: a tag whose release failed (v0.1.32, v0.1.34)
        # has no release page, so notes counted from it would leave its PRs
        # out of every release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "GORELEASER_PREVIOUS_TAG=$(gh release view --repo cdalar/onctl --json tagName -q .tagName)" >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # --parallelism=1: onctl-2 can't build all targets at once without
          # OOM-killing the compiler (see edge.yml); one target at a time.
          args: release --timeout 120m --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GH_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
