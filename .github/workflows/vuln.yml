name: vuln

permissions: 
  contents: read
  
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '0 10 * * 1' # run "At 10:00 on Monday"
  workflow_call:

concurrency:
  # A new push to a PR cancels that PR's still-running checks; other events
  # get a unique group, so they are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  run:
    name: Vuln
    runs-on: onctl-2
    timeout-minutes: 5
    strategy:
      fail-fast: true

    steps:
      - name: Install Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Go cache
        # setup-go's built-in cache is off: it only matches its exact key
        # (Go version + go.sum hash), and Dependabot's auto-merges push to
        # main with GITHUB_TOKEN, which runs no push workflows -- so main
        # never had a cache for the current go.sum and every PR compiled
        # the AWS/Azure/GCP SDKs from scratch (~3 min a job on onctl-2).
        # restore-keys falls back to main's newest cache for an older
        # go.sum, which still covers nearly every dependency.
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-vuln-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-vuln-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c # v1.8.0

      - name: Run govulncheck
        run: govulncheck -test ./...

      - name: Save Go cache
        # main only: a PR's cache is readable by that PR alone, and ~400MB
        # per PR pushed main's entries out of the repo's 10GB cache quota.
        if: ${{ github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
