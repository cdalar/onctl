name: plugin-release

# Publishes the Claude Code plugin with each onctl release. The marketplace
# (.claude-plugin/marketplace.json) serves the plugin from the
# plugin-stable branch, not from main: on a release tag, this takes
# claude-plugin/ as it is at that tag, stamps plugin.json with the
# release's version (v0.1.34 -> 0.1.34), and force-pushes the result to
# plugin-stable. So users get exactly the plugin that shipped with each
# onctl release, labelled with the same version, and work in progress on
# main doesn't reach them early.
#
# A branch rather than a commit to main: a commit made with this
# workflow's token can't go through main's required checks (its pushes
# and pull requests trigger no workflows).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the plugin from (e.g. v0.1.34)"
        required: true

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: onctl-2
    permissions:
      contents: write # push the plugin-stable branch
    steps:
      - name: Resolve the release
        id: release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG isn't a release tag (vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: true

      - name: Stamp the plugin with the release version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          f=claude-plugin/.claude-plugin/plugin.json
          [ -f "$f" ] || { echo "::error::no plugin at this tag"; exit 1; }
          jq --arg v "$VERSION" '.version = $v' "$f" >"$f.tmp" && mv "$f.tmp" "$f"
          jq -r '"\(.name) \(.version)"' "$f"

      - name: Push plugin-stable
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Claude Code plugin $VERSION (from $TAG)"
          git push --force origin HEAD:refs/heads/plugin-stable
