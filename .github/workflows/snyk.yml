name: snyk

on: pull_request_target

permissions:
  contents: read
  security-events: write

concurrency:
  # A new push to a PR cancels that PR's still-running checks; other events
  # get a unique group, so they are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: onctl-2
    # if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true # To make sure that SARIF upload gets called
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: snyk.sarif
