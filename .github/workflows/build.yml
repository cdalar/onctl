name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
  - cron: '0 10 * * 1' # run "At 10:00 on Monday"
  workflow_call:
    inputs:
      skipTests:
        description: 'Skip tests, useful when there is a dedicated CI job for tests'
        default: false
        required: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}

concurrency:
  # A new push to a PR cancels that PR's still-running checks; other events
  # get a unique group, so they are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  run:
    name: Build
    runs-on: ubuntu-latest
    # GitHub-hosted runners are slower than onctl-2 was; -race tests need
    # the headroom.
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        go: ['stable']

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false

      - name: Restore Go cache
        # setup-go's built-in cache is off: it only matches its exact key
        # (Go version + go.sum hash), and Dependabot's auto-merges push to
        # main with GITHUB_TOKEN, which runs no push workflows -- so main
        # never had a cache for the current go.sum and every PR compiled
        # the AWS/Azure/GCP SDKs from scratch (~3 min a job on onctl-2).
        # restore-keys falls back to main's newest cache for an older
        # go.sum, which still covers nearly every dependency.
        # Separate per job, so this one keeps the -race test objects.
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Go Format
        run: gofmt -s -w . && git diff --exit-code

      - name: Go Tidy
        run: go mod tidy && git diff --exit-code

      - name: Go Vet
        run: go vet ./...

      - name: Go Mod
        run: go mod download

      - name: Go Mod Verify
        run: go mod verify

      - name: Go Generate
        run: go generate ./... && git diff --exit-code

      - name: Go Build
        run: go build -o /dev/null ./...

      # The edge and release builds also make macOS and Windows binaries
      # (.goreleaser*.yml); building for them here catches a Linux-only
      # import before it reaches main and breaks edge.
      - name: Go Build (other release targets)
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null . || exit 1
          done

      - name: Go Compile Tests
        if: ${{ inputs.skipTests }}
        run: go test -exec /bin/true ./...

      - name: Go Test
        if: ${{ !inputs.skipTests }}
        run: go test -v -count=1 -race -shuffle=on -coverprofile=coverage.txt ./...

      - name: Go Benchmark
        # Not on PRs: it only smoke-runs benchmarks (1x) and main/schedule cover it.
        if: ${{ !inputs.skipTests && github.event_name != 'pull_request' }}
        run: go test -v -shuffle=on -run=- -bench=. -benchtime=1x ./...

      - name: Upload Coverage
        if: ${{ !inputs.skipTests }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./coverage.txt
          fail_ci_if_error: false

      - name: Save Go cache
        # main only: a PR's cache is readable by that PR alone, and ~400MB
        # per PR pushed main's entries out of the repo's 10GB cache quota.
        if: ${{ github.event_name != 'pull_request' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
